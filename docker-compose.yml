services:
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD}
      HEALTHCARE_ADMIN_PASSWORD: ${HEALTHCARE_ADMIN_PASSWORD}
    volumes:
      - mongo_data:/data/db                                 # persistance des données
      - ./mongo-init:/docker-entrypoint-initdb.d:ro          # création des utilisateurs
    healthcheck:                                            # "prêt" = répond au ping
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  migration:
    build: ./migration
    container_name: migration
    depends_on:
      mongodb:
        condition: service_healthy                          # attend que MongoDB soit prêt
    environment:
      MONGO_HOST: mongodb                                   # nom du service = nom réseau
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: migration_user                            # compte readWrite, pas root
      MONGO_PASSWORD: ${MIGRATION_PASSWORD}
      CSV_PATH: /app/data/healthcare_dataset.csv
      EXPORT_DIR: /app/exports
    volumes:
      - ./data:/app/data:ro                                 # CSV source, lecture seule
      - ./exports:/app/exports                              # rapport et exports
    restart: "no"                                           # tâche ponctuelle

volumes:
  mongo_data:
